name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capacity:
        description: Run bounded synthetic storage and 30000-chunk capacity measurements
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --no-editable
      - name: Validate Linux service and ingress templates
        if: matrix.python == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-core systemd
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="dots-brain-templates-") as temporary:
              root = Path(temporary)
              (root / "nginx").mkdir()
              (root / "data").mkdir()
              nginx = shutil.which("nginx")
              config = root / "ingress.conf"
              config.write_text(
                  Path("deploy/nginx/dots-brain.conf").read_text().replace(
                      "/run/dots-brain-ingress", str(root / "nginx")
                  ).replace("192.0.2.1:", "127.0.0.1:")
              )
              subprocess.run([nginx, "-t", "-q", "-e", "stderr", "-c", str(config)], check=True)
              units = []
              for source in sorted(Path("deploy/systemd").glob("*.service")):
                  unit = root / source.name
                  unit.write_text(
                      source.read_text()
                      .replace("/opt/dots-brain/current/.venv/bin/dots-brain", "/usr/bin/true")
                      .replace("/var/lib/dots-brain", str(root / "data"))
                      .replace("/usr/sbin/nginx", nginx)
                      .replace("/etc/dots-brain/ingress.conf", str(config))
                  )
                  units.append(str(unit))
              subprocess.run(
                  ["systemd-analyze", "verify", "--man=no", "--recursive-errors=no", *units],
                  check=True,
              )
          PY
      - name: Exercise nginx request-body buffering as an unprivileged user
        if: matrix.python == '3.11'
        run: |
          test "$(id -u)" -ne 0
          command -v nginx
          uv run pytest -q tests/test_nginx_ingress.py
      - run: uv run ruff check src tests scripts modules
      - run: uv run ruff format --check src tests scripts modules
      - run: uv run pytest -q
      - run: uv run python scripts/validate_project.py
      - run: uv build
      - name: Verify a fresh core-only wheel installation
        run: |
          CHECK_ROOT=$(mktemp -d)
          trap 'rm -rf "$CHECK_ROOT"' EXIT
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$CHECK_ROOT/core-requirements.txt" > /dev/null
          uv venv --python '${{ matrix.python }}' "$CHECK_ROOT/venv"
          uv pip sync --python "$CHECK_ROOT/venv/bin/python" --require-hashes "$CHECK_ROOT/core-requirements.txt"
          set -- dist/*.whl
          test "$#" -eq 1
          sha256sum -- "$1"
          uv pip install --python "$CHECK_ROOT/venv/bin/python" --no-deps "$1"
          env -u PYTHONPATH "$CHECK_ROOT/venv/bin/python" scripts/verify_wheel.py

  semantic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.capacity && 80 || 20 }}
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra semantic --no-editable
      - name: Derive the cache identity from the canonical model manifest
        id: model
        run: |
          uv run --locked --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from dots_brain.semantic import FILES, MODEL_ID, MODEL_REVISION

          manifest = json.dumps({"model": MODEL_ID, "files": FILES}, sort_keys=True).encode()
          identity = hashlib.sha256(manifest).hexdigest()
          data_directory = Path(os.environ["RUNNER_TEMP"]) / "dots-brain-semantic"
          directory = data_directory / "models" / MODEL_REVISION
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"cache-key={identity}", file=output)
              print("files<<MODEL_FILES", file=output)
              for name in sorted(FILES):
                  print(directory / name, file=output)
              print("MODEL_FILES", file=output)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              print(f"BRAIN_CI_DATA_DIR={data_directory}", file=environment)
              print(f"BRAIN_TEST_MODEL_DIR={directory}", file=environment)
          PY
      - name: Cache only pinned public model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.model.outputs.files }}
          key: semantic-model-${{ runner.os }}-${{ steps.model.outputs.cache-key }}
      - name: Prepare and verify every model artifact, including cache hits
        run: |
          uv run --locked --no-sync dots-brain --data-dir "$BRAIN_CI_DATA_DIR" setup
          uv run --locked --no-sync dots-brain --data-dir "$BRAIN_CI_DATA_DIR" model prepare
          test -d "$BRAIN_TEST_MODEL_DIR"
          echo 'HF_HUB_OFFLINE=1' >> "$GITHUB_ENV"
          echo 'TRANSFORMERS_OFFLINE=1' >> "$GITHUB_ENV"
          echo 'UV_OFFLINE=true' >> "$GITHUB_ENV"
      - name: Run the real local model test
        run: |
          uv run --locked --no-sync pytest -q \
            tests/test_semantic.py::test_real_local_model_retrieves_english_memory_from_czech_question \
            --junitxml="$RUNNER_TEMP/semantic-model.junit.xml"
      - name: Require the real model test to execute and pass
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / "semantic-model.junit.xml"
          cases = ET.parse(report).getroot().findall(".//testcase")
          expected = "test_real_local_model_retrieves_english_memory_from_czech_question"
          if len(cases) != 1 or cases[0].get("name") != expected:
              raise SystemExit("Expected exactly the named real-model test in JUnit.")
          if any(cases[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
              raise SystemExit("The real-model test must pass without being skipped.")
          print(f"Verified execution: {expected}")
          PY
      - name: Measure the frozen synthetic CZ/EN retrieval baseline
        run: |
          uv run --locked --no-sync python scripts/retrieval_baseline.py --model-dir "$BRAIN_TEST_MODEL_DIR" --output "$RUNNER_TEMP/retrieval-baseline.json"
          test -s "$RUNNER_TEMP/retrieval-baseline.json"
      - name: Measure development relevance with all fixture seeds
        run: |
          uv run --locked --no-sync python scripts/retrieval_baseline.py --model-dir "$BRAIN_TEST_MODEL_DIR" --corpus tests/fixtures/retrieval/cz-en-dev-v2.json --output "$RUNNER_TEMP/retrieval-development.json"
      - name: Measure bounded capacity in a disposable 2 GiB systemd unit
        if: github.event_name == 'workflow_dispatch' && inputs.capacity
        run: |
          mkdir "$RUNNER_TEMP/capacity"
          cat > "$RUNNER_TEMP/capacity/run.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          group = next(line.split(":", 2)[2] for line in Path("/proc/self/cgroup").read_text().splitlines() if line.startswith("0::"))
          root = Path("/sys/fs/cgroup") / group.lstrip("/")
          limits = {name: (root / name).read_text().strip() for name in ("memory.max", "memory.swap.max")}
          assert limits == {"memory.max": "2147483648", "memory.swap.max": "0"}, limits
          Path(os.environ["CAPACITY_OUTPUT"], "resource-budget.json").write_text(json.dumps({"state": "limits_verified", "scope": "harness and all descendant processes", "limits": limits, "unit_runtime_seconds": 3900, "index_seconds": 900, "query_seconds_per_run": 900, "runs": 3}) + "\n")
          PY
          uv run --locked --no-sync python scripts/stress.py --records 100 --workers 1 --http-calls 100 --output "$CAPACITY_OUTPUT/storage-100.json"
          uv run --locked --no-sync python scripts/stress.py --records 1000 --workers 8 --http-calls 100 --output "$CAPACITY_OUTPUT/storage-1000.json"
          uv run --locked --no-sync python scripts/stress.py --records 5000 --workers 16 --http-calls 100 --output "$CAPACITY_OUTPUT/storage-5000.json"
          uv run --locked --no-sync python scripts/stress_semantic.py --model-dir "$BRAIN_TEST_MODEL_DIR" --records 450 --chunks-per-record 67 --workers 4 --queries 100 --runs 3 --index-timeout 900 --query-timeout 900 --output "$CAPACITY_OUTPUT/semantic-450.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          group = next(line.split(":", 2)[2] for line in Path("/proc/self/cgroup").read_text().splitlines() if line.startswith("0::"))
          root = Path("/sys/fs/cgroup") / group.lstrip("/")
          path = Path(os.environ["CAPACITY_OUTPUT"], "resource-budget.json")
          receipt = json.loads(path.read_text())
          receipt.update(state="completed", memory_peak_bytes=int((root / "memory.peak").read_text()), memory_events=(root / "memory.events").read_text())
          events = dict(line.split() for line in receipt["memory_events"].splitlines())
          assert int(events.get("oom", "0")) == 0 and int(events.get("oom_kill", "0")) == 0, events
          assert receipt["memory_peak_bytes"] <= 2147483648, receipt
          path.write_text(json.dumps(receipt) + "\n")
          PY
          SH
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --unit="dots-brain-capacity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property="User=$(id -un)" --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --property=MemoryMax=2147483648 --property=MemorySwapMax=0 \
            --property=RuntimeMaxSec=3900 --property=KillMode=control-group \
            --setenv="PATH=$PATH" --setenv="CAPACITY_OUTPUT=$RUNNER_TEMP/capacity" \
            --setenv="BRAIN_TEST_MODEL_DIR=$BRAIN_TEST_MODEL_DIR" \
            --setenv=HF_HUB_OFFLINE=1 --setenv=HF_HUB_DISABLE_TELEMETRY=1 \
            --setenv=TRANSFORMERS_OFFLINE=1 --setenv=UV_OFFLINE=true \
            /bin/bash "$RUNNER_TEMP/capacity/run.sh"
      - name: Upload synthetic retrieval evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-retrieval-baseline
          path: |
            ${{ runner.temp }}/semantic-model.junit.xml
            ${{ runner.temp }}/retrieval-baseline.json
            ${{ runner.temp }}/retrieval-development.json
            ${{ runner.temp }}/capacity/*.json
          if-no-files-found: error
          retention-days: 14
