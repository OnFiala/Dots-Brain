# Example dedicated gateway. It is not part of a host's main nginx service.
# Replace the TEST-NET listener and allowed ingress peer for the local network or
# tunnel connector that actually terminates TLS. Keep the service loopback-only;
# OAuth still authenticates every memory request.
worker_processes 1;
pid /run/dots-brain-ingress/nginx.pid;
error_log /dev/null;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /run/dots-brain-ingress/body;
    proxy_temp_path /run/dots-brain-ingress/proxy;
    fastcgi_temp_path /run/dots-brain-ingress/fastcgi;
    uwsgi_temp_path /run/dots-brain-ingress/uwsgi;
    scgi_temp_path /run/dots-brain-ingress/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    client_max_body_size 1m;

    # Fixed host keys bound total load, regardless of spoofed forwarding headers.
    limit_req_zone $server_name zone=all_requests:1m rate=20r/s;
    limit_req_zone $server_name zone=registrations:1m rate=6r/m;
    limit_req_zone $server_name zone=authorizations:1m rate=12r/m;
    limit_conn_zone $server_name zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream dots_brain_backend {
        server 127.0.0.1:8787;
        keepalive 8;
    }

    server {
        listen 192.0.2.1:8788;
        server_name memory.example.com;
        if ($host != memory.example.com) { return 404; }
        allow 192.0.2.2;
        deny all;
        limit_req zone=all_requests burst=40 nodelay;
        limit_conn connections 16;

        proxy_pass_request_headers on;
        proxy_set_header Host memory.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        # Per-source limits fall back to a bounded shared gateway bucket.
        # Do not trust a client-supplied source-IP header.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /mcp {
            proxy_read_timeout 300s;
            limit_except GET POST DELETE OPTIONS { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location = /register {
            # Owner opens a short registration window during client onboarding.
            # The onboarding unit removes its runtime directory after 10 minutes.
            if (!-f /run/dots-brain-onboarding/enabled) { return 503; }
            client_max_body_size 16k;
            limit_req zone=all_requests burst=40 nodelay;
            limit_req zone=registrations burst=5 nodelay;
            limit_except POST OPTIONS { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location ~ ^/(token|revoke)$ {
            client_max_body_size 16k;
            limit_except POST OPTIONS { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location = /authorize {
            if (!-f /run/dots-brain-onboarding/enabled) { return 503; }
            client_max_body_size 16k;
            limit_req zone=all_requests burst=40 nodelay;
            limit_req zone=authorizations burst=5 nodelay;
            limit_except GET POST OPTIONS { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource/mcp)$ {
            limit_except GET OPTIONS { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location ~ "^/oauth/pair/req_[A-Za-z0-9_-]{16,128}$" {
            if (!-f /run/dots-brain-onboarding/enabled) { return 503; }
            limit_except GET POST { deny all; }
            proxy_pass http://dots_brain_backend;
        }

        location / { return 404; }
    }
}
