[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dots-brain"
version = "0.1.0a1"
description = "One source-aware memory for your AI tools, hosted on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dots Brain contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]

[project.scripts]
dots-brain = "dots_brain.cli:main"

[project.urls]
Homepage = "https://github.com/OnFiala/dots-brain"
Issues = "https://github.com/OnFiala/dots-brain/issues"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/dots_brain"]
