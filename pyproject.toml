[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dots-brain"
version = "0.4.0a2"
description = "One source-aware memory for your AI tools, hosted on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dots Brain contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "anyio>=4.8,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.30,<1.31",
  "pydantic>=2.10,<3",
  "starlette>=0.45,<2",
  "tomlkit>=0.13,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]

[project.scripts]
dots-brain = "dots_brain.cli:main"

[project.urls]
Homepage = "https://github.com/OnFiala/dots-brain"
Issues = "https://github.com/OnFiala/dots-brain/issues"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/dots_brain"]
